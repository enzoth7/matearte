name: Deploy - Vercel (MateArte)

on:
  # Vercel's Git integration handles automatic builds. Keep this as a manual fallback.
  workflow_dispatch:
    inputs:
      project:
        description: Proyecto a desplegar en producci�n
        required: true
        type: choice
        options:
          - matearte-gestion
          - matearte-web
          - matearte-personalizador

permissions:
  contents: read

concurrency:
  group: deploy-vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_Q5mgDmc9QFiOscny3YmDZK3l

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      DEPLOY_PROJECT: ${{ inputs.project }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_ENZOGASTON12 }}
    steps:
      - name: Seleccionar el proyecto
        run: |
          case "$DEPLOY_PROJECT" in
            matearte-gestion) project_id=prj_UPVUd9hsRnFavUsQ8KBltCFpLvfX ;;
            matearte-web) project_id=prj_aSWhysDQelDrnTWGmcHUoTB7fkFV ;;
            matearte-personalizador) project_id=prj_gfTLsfVKOfsFe9t5haSyIlVJn5p3 ;;
            *) echo 'Proyecto desconocido' >&2; exit 1 ;;
          esac
          echo "VERCEL_PROJECT_ID=$project_id" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Instalar Vercel CLI
        run: npm install --global vercel@50.1.3
      - name: Traer configuraci�n de producci�n
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Construir
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Quitar metadatos del repositorio
        run: rm -rf .git
      - name: Desplegar
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

