name: Deploy - Vercel (MateArte)

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/deploy-vercel.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_Q5mgDmc9QFiOscny3YmDZK3l

jobs:
  deploy:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - project: matearte-web
            project_id: prj_aSWhysDQelDrnTWGmcHUoTB7fkFV
          - project: matearte-gestion
            project_id: prj_UPVUd9hsRnFavUsQ8KBltCFpLvfX
          - project: matearte-personalizador
            project_id: prj_gfTLsfVKOfsFe9t5haSyIlVJn5p3
    env:
      VERCEL_PROJECT_ID: ${{ matrix.project_id }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_ENZOGASTON12 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Instalar Vercel CLI
        run: npm install --global vercel@50.1.3
      - name: Traer configuración de producción
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Construir
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Quitar metadatos del repositorio
        run: rm -rf .git
      - name: Desplegar
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

