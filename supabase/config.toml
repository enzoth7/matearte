[functions.auth-handoff]
enabled = true
verify_jwt = true
entrypoint = "./functions/auth-handoff/index.ts"

[functions.commerce-email]
enabled = true
verify_jwt = false
entrypoint = "./functions/commerce-email/index.ts"

[functions.lifecycle-email]
enabled = true
verify_jwt = false
import_map = "./functions/lifecycle-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/lifecycle-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/lifecycle-email/*.html" ]
